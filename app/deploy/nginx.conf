user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # JSON access log -> CloudWatch metric filters ({ $.status >= 500 })
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';
    access_log /var/log/nginx/access.json json;

    # Basic abuse protection
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    client_max_body_size 10m;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2 default_server;
        server_name _;

        ssl_certificate     /etc/pki/vault/fullchain.pem;
        ssl_certificate_key /etc/pki/vault/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Browser UI: static React build from fe/ (no server-side rendering).
        root /usr/share/nginx/vault;
        location / {
            limit_req zone=perip burst=40 nodelay;
            try_files $uri /index.html;
        }

        # API, file downloads and health check: gunicorn (Flask).
        location ~ ^/(api|files|health)(/|$) {
            limit_req zone=perip burst=40 nodelay;
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   X-TLS-Protocol    $ssl_protocol;
            proxy_set_header   X-TLS-Cipher      $ssl_cipher;
            proxy_read_timeout 60s;
        }
    }
}
